# Helm values for External Secrets Operator
replicaCount: 2

serviceAccount:
  create: true
  name: external-secrets
  # role-arn injected by Terraform via IRSA

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

installCRDs: true
